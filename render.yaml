services:
  - type: web
    name: open-algotrade-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HYPERLIQUID_PRIVATE_KEY
        sync: false
      - key: HYPERLIQUID_NETWORK
        value: testnet
      - key: VAULT_ADDRESS
        sync: false
    plan: free
